<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <div class="cards-container">
      <!-- Card -->
      <div
        class="card"
        data-qa="card"
      >
        <img
          class="card__image"
          src="./images/imac.jpeg"
          alt="Apple iMac 24"
        />
        <h2 class="card__title">Apple iMac 24</h2>
        <p class="card__description">
          Powerful all-in-one desktop with stunning Retina display.
        </p>
        <div class="card__price">
          <span class="card__price-current">$1,299</span>
          <span class="card__price-old">$1,499</span>
        </div>
        <div class="card__reviews">
          <div class="card__stars">
            <div class="stars">
              <div class="stars__star"></div>
              <div class="stars__star"></div>
              <div class="stars__star"></div>
              <div class="stars__star"></div>
              <div class="stars__star"></div>
            </div>
          </div>
        </div>
        <div class="card__buttons">
          <a
            href="#"
            class="card__btn card__btn--buy"
            data-qa="hover"
          >
            BUY
          </a>
          <a
            href="#"
            class="card__btn card__btn--details"
          >
            Details
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
