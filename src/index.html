<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="cards-container">
      <article
        class="card"
        data-qa="card"
      >
        <img
          class="card__image"
          src="./images/imac.jpeg"
          alt="Apple iMac 24"
        />
        <h2 class="card__title">Apple iMac 24</h2>
        <p class="card__description">
          Powerful all-in-one desktop with stunning Retina display.
        </p>
        <div class="card__price">
          <span class="card__price-current">$1,299</span>
          <span class="card__price-old">$1,499</span>
        </div>
        <div class="card__reviews">
          <div class="stars stars--4">
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
          </div>
        </div>
        <div class="card__buttons">
          <a
            href="#"
            class="card__button card__button--buy"
            data-qa="hover"
          >
            BUY
          </a>
          <a
            href="#"
            class="card__button card__button--details"
          >
            Details
          </a>
        </div>
      </article>
    </div>
  </body>
</html>
